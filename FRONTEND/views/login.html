<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector - Iniciar Sesión</title>
    <!-- Tipografía  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- paleta de colores -->
    <style>
        :root {
            --c-white: #ffffff;
            --c-black: #111418;
            --c-navy-dark: #1e2638;
            --c-slate-blue: #3d4a63;
            --c-gold-dark: #c9933b;
            --c-gold-light: #f5c76c;
            --c-card-bg: #1c2333;
            --c-input-bg: #273144;
            --c-text-muted: #9aa7bf;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--c-black);
            background: radial-gradient(circle at 18% 50%, var(--c-navy-dark) 0%, var(--c-black) 92%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
            color: #ffffff;
        }

        .top-navbar {
            background: rgba(17, 20, 24, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            padding: 1.1rem 0;
            width: 100%;
        }

        .navbar-brand-custom {
            color: var(--c-gold-light);
            font-weight: 800;
            letter-spacing: 2px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 1.25rem;
            transition: opacity 0.2s;
        }

        .navbar-brand-custom:hover {
            color: #ffffff;
        }

        .nav-quick-link {
            color: var(--c-text-muted);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .nav-quick-link:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
        }

        .main-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
        }

        .hero-section {
            width: 100%;
            max-width: 1360px; /* Ancho extendido */
        }

        /* TIPOGRAFÍA PRINCIPAL AUMENTADA */
        .brand-headline {
            font-size: clamp(3.2rem, 5.5vw, 5.5rem);
            font-weight: 900;
            letter-spacing: -1.5px;
            color: var(--c-gold-light);
            line-height: 1;
            margin-bottom: 1.25rem;
            text-transform: uppercase;
        }

        .brand-subtext {
            font-size: clamp(1.2rem, 1.8vw, 1.6rem);
            line-height: 1.45;
            color: #d1d9e6;
            max-width: 540px;
            font-weight: 400;
        }

        .card-custom {
            background-color: var(--c-card-bg);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 20px;
            box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 480px; /* Tarjeta más ancha y espaciosa */
        }

        .form-label {
            color: #d5deeb;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 0.45rem;
        }

        .form-control {
            background-color: var(--c-input-bg);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            border-radius: 10px;
            padding: 0.85rem 1.15rem;
            font-size: 1.05rem;
        }

        .form-control:focus {
            background-color: var(--c-input-bg);
            border-color: var(--c-gold-light);
            color: #ffffff;
            box-shadow: 0 0 0 0.25rem rgba(245, 199, 108, 0.22);
        }

        .form-control::placeholder {
            color: #697891;
        }

        .btn-gold-primary {
            background-color: var(--c-gold-dark);
            border: none;
            color: #111418;
            font-weight: 700;
            font-size: 1.05rem;
            padding: 0.9rem;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .btn-gold-primary:hover {
            background-color: var(--c-gold-light);
            color: #111418;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(201, 147, 59, 0.3);
        }

        .btn-slate-accent {
            background-color: var(--c-slate-blue);
            border: none;
            color: #ffffff;
            font-weight: 700;
            font-size: 1rem;
            padding: 0.85rem;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .btn-slate-accent:hover {
            background-color: #4e5f7e;
            color: #ffffff;
            transform: translateY(-1px);
        }

        hr.divider-custom {
            border-color: rgba(255, 255, 255, 0.12);
            margin: 1.75rem 0;
        }
    </style>
</head>
<body>

    <!-- BARRA SUPERIOR -->
    <header class="top-navbar">
        <div class="container-fluid px-4 px-md-5 d-flex justify-content-between align-items-center">
            <a href="#" class="navbar-brand-custom">
                <i class="bi bi-compass fs-4"></i>
                <span>VECTOR</span>
            </a>
            
            <!-- Derecha: Acceso rápido -->
            <nav class="d-flex align-items-center gap-3">
                <a href="#ayuda" class="nav-quick-link">
                    <i class="bi bi-question-circle"></i>
                    <span>Ayuda</span>
                </a>
                <a href="#faq" class="nav-quick-link">
                    <i class="bi bi-chat-square-text"></i>
                    <span>FAQ</span>
                </a>
            </nav>
        </div>
    </header>

    <main class="main-container">
        <div class="hero-section">
            <div class="row align-items-center justify-content-between g-5">
                <div class="col-lg-6 text-center text-lg-start">
                    <h1 class="brand-headline">VECTOR</h1>
                    <p class="brand-subtext">
                        Centraliza tus cuentas, tarjetas y efectivo en un solo balance real. Controla tus hábitos y proyecta tus metas financieras.
                    </p>
                </div>

                <div class="col-lg-5 d-flex justify-content-center justify-content-lg-end">
                    <div class="card card-custom p-4 p-md-5">
                        
                        <!-- LOGIN -->
                        <form id="formLogin" action="">
                            <h3 class="fw-bold mb-1 fs-3" style="color: var(--c-white);">Iniciar Sesión</h3>

                            <div class="mb-3">
                                <label class="form-label">Correo Electrónico</label>
                                <input type="email" name="email" class="form-control" required placeholder="correo@ejemplo.com">
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Contraseña</label>
                                <input type="password" name="password" class="form-control" required placeholder="Tu contraseña">
                            </div>

                            <button type="submit" class="btn btn-gold-primary w-100 mb-3 shadow-sm">Ingresar</button>

                            <div class="text-center my-2">
                                <a href="#" class="text-decoration-none small" style="color: var(--c-gold-light);">¿Olvidaste tu contraseña?</a>
                            </div>

                            <hr class="divider-custom">

                            <div class="text-center">
                                <button type="button" class="btn btn-slate-accent w-100" onclick="toggleForms()">
                                    Crear cuenta nueva
                                </button>
                            </div>
                        </form>

                        <!-- REGISTRO -->
                        <form id="formRegister" action="" class="d-none">
                            <h3 class="fw-bold mb-1 fs-3" style="color: var(--c-white);">Crear Cuenta</h3>
                            <p class= "mb-4" style="color: var(--c-white);">Comienza a manejar tus finanzas</p>

                            <div class="mb-3">
                                <label class="form-label">Nombre Completo</label>
                                <input type="text" name="name" class="form-control" required placeholder="Tu nombre">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Correo Electrónico</label>
                                <input type="email" name="email" class="form-control" required placeholder="correo@ejemplo.com">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Contraseña</label>
                                <input type="password" name="password" class="form-control" required placeholder="Crea una contraseña">
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Confirmar Contraseña</label>
                                <input type="password" name="confirm_password" class="form-control" required placeholder="Repite la contraseña">
                            </div>

                            <button type="submit" class="btn btn-gold-primary w-100 mb-3 shadow-sm">Registrarme</button>

                            <hr class="divider-custom">

                            <div class="text-center">
                                <button type="button" class="btn btn-slate-accent w-100" onclick="toggleForms()">
                                    Ya tengo cuenta
                                </button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleForms() {
            const login = document.getElementById('formLogin');
            const register = document.getElementById('formRegister');
            login.classList.toggle('d-none');
            register.classList.toggle('d-none');
        }
    </script>
    <script src="../controllers/env.js"></script>
    <script src="../controllers/auth_controller.js"></script>
</body>
</html>
